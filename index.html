<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Truck Damage Dictionary · UVeye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0c1a35;--navy-mid:#162242;
  --teal:#0d9488;
  --ink:#0f172a;--ink-2:#334155;--ink-3:#64748b;--ink-4:#94a3b8;
  --bg:#f8fafc;--surface:#ffffff;--line:#e2e8f0;--line-2:#cbd5e1;
  --s1:#dc2626;--s1b:#fef2f2;--s1l:#fecaca;
  --s2:#d97706;--s2b:#fffbeb;--s2l:#fde68a;
  --s3:#2563eb;--s3b:#eff6ff;--s3l:#bfdbfe;
  --sidebar:220px;
  --zone-hover:#dbeafe;--zone-active:#1d4ed8;--zone-active-soft:#eff6ff;
}
:root.dark{
  --navy:#060e1f;--navy-mid:#0d1829;
  --ink:#e2e8f0;--ink-2:#94a3b8;--ink-3:#64748b;--ink-4:#475569;
  --bg:#0f172a;--surface:#1e293b;--line:#1e293b;--line-2:#334155;
  --s1:#f87171;--s1b:#450a0a;--s1l:#991b1b;
  --s2:#fbbf24;--s2b:#451a03;--s2l:#92400e;
  --s3:#60a5fa;--s3b:#172554;--s3l:#1e40af;
  --zone-hover:#1e3a5f;--zone-active:#3b82f6;--zone-active-soft:#1e3a5f;
}
html{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0}
input,select,textarea{font-family:inherit}

/* Sidebar */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;z-index:100;user-select:none}
.sidebar-logo{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo-mark{display:flex;align-items:center;gap:10px}
.sidebar-logo-mark span{font-size:13px;font-weight:600;color:white;letter-spacing:-0.3px}
.sidebar-logo-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:7px;cursor:pointer;transition:background .12s;color:rgba(255,255,255,0.55);font-size:13px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.9)}
.nav-item.active{background:rgba(255,255,255,0.13);color:white}
.nav-item svg{flex-shrink:0;opacity:0.7}
.nav-item.active svg{opacity:1}
.sidebar-fleet{margin:10px 10px 0;padding:9px 12px;background:rgba(255,255,255,0.06);border-radius:7px;border:1px solid rgba(255,255,255,0.1)}
.sidebar-fleet-name{font-size:11px;font-weight:600;color:rgba(255,255,255,0.4)}
.sidebar-fleet-val{font-size:12.5px;font-weight:600;color:white;margin-top:2px}
.sidebar-footer{padding:12px 10px;border-top:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:4px}
.sidebar-btn{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.45);cursor:pointer;border-radius:6px;padding:7px 10px;width:100%;transition:color .12s;text-align:left}
.sidebar-btn:hover{color:white;background:rgba(255,255,255,0.07)}

/* Main layout */
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.fleet-banner{background:var(--navy-mid);color:white;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,0.08)}
.fleet-banner-name{font-weight:600;display:flex;align-items:center;gap:8px}
.fleet-banner-actions a{color:rgba(255,255,255,0.6);text-decoration:none;font-size:12px}
.fleet-banner-actions a:hover{color:white}

/* Filter bar */
.filterbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.search-wrap{position:relative;flex:0 0 220px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-4)}
.search-input{width:100%;padding:7px 10px 7px 32px;border:1.5px solid var(--line);border-radius:7px;font-size:13px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--teal)}
.filter-pill{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:all .12s;white-space:nowrap}
.filter-pill:hover{border-color:var(--line-2);background:var(--bg)}
.filter-pill.active{background:var(--ink);border-color:var(--ink);color:white}
.filter-pill.sev1.active{background:var(--s1);border-color:var(--s1);color:white}
.filter-pill.sev2.active{background:var(--s2);border-color:var(--s2);color:white}
.filter-pill.sev3.active{background:var(--s3);border-color:var(--s3);color:white}
.filter-sep{width:1px;height:20px;background:var(--line);flex-shrink:0}
.filter-select{padding:5px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:12px;color:var(--ink-2);background:var(--surface);cursor:pointer;outline:none}
.filter-select:focus{border-color:var(--teal)}
.filter-examples{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1.5px solid var(--line);border-radius:20px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.filter-examples:hover{background:var(--bg)}
.filter-examples.active{border-color:var(--teal);color:var(--teal);background:var(--zone-active-soft)}
.filter-count{padding:1px 6px;border-radius:10px;background:var(--line);font-size:11px;font-weight:600;color:var(--ink-3)}
.filter-examples.active .filter-count{background:rgba(13,148,136,0.12);color:var(--teal)}
.content{flex:1;padding:0 24px 48px}

/* SEV badge */
.sev-badge{display:inline-flex;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600}
.sev-badge.s1{background:var(--s1b);color:var(--s1)}
.sev-badge.s2{background:var(--s2b);color:var(--s2)}
.sev-badge.s3{background:var(--s3b);color:var(--s3)}
.sev-badge.s0{background:var(--bg);color:var(--ink-4);border:1px solid var(--line)}

/* Overview */
.overview{padding:24px 0}
.ov-bar-wrap{margin-bottom:28px}
.ov-bar-label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:8px;letter-spacing:0.3px}
.ov-bar{height:36px;border-radius:8px;overflow:hidden;display:flex;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.ov-bar-seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:white;transition:flex .4s;cursor:pointer;letter-spacing:0.5px}
.ov-bar-seg:hover{filter:brightness(1.08)}
.ov-sev{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px}
.ov-sev-card{border-radius:12px;overflow:hidden;border:1.5px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s}
.ov-sev-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.ov-sev-top{padding:18px 20px 14px}
.ov-sev-top h3{font-size:36px;font-weight:800;line-height:1;margin-bottom:4px}
.ov-sev-label{font-size:11px;font-weight:700;letter-spacing:0.5px;margin-bottom:6px}
.ov-sev-cust{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:4px}
.ov-sev-action{font-size:13px;color:var(--ink-3)}
.ov-sev-bottom{padding:12px 20px;background:var(--surface);border-top:1.5px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center}
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ov-stat{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.ov-stat:hover{border-color:var(--line-2)}
.ov-stat-num{font-size:28px;font-weight:800;color:var(--navy);line-height:1;margin-bottom:4px}
.ov-stat-label{font-size:12px;color:var(--ink-3)}

/* Table */
.tbl-wrap{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:20px}
table{width:100%;border-collapse:collapse}
th{padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--bg);border-bottom:1.5px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--ink);background:var(--line)}
td{padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* Car parts */
.parts-wrap{margin-top:20px;display:flex;flex-direction:column;gap:4px}
.part-group{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.part-group-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none}
.part-group-hd:hover{background:var(--bg)}
.part-group-name{font-size:14px;font-weight:600;flex:1;color:var(--ink)}
.part-group-meta{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:10px}
.part-cov{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.cov-full{background:#dcfce7;color:#15803d}
.cov-part{background:#fef9c3;color:#a16207}
.cov-none{background:var(--bg);color:var(--ink-4);border:1px solid var(--line)}
.part-detections{padding:0 18px 14px;display:flex;flex-direction:column;gap:4px}
.det-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.det-row:hover{background:var(--bg)}
.det-row-name{flex:1;font-size:13px;font-weight:500;color:var(--ink)}

/* Browse */
.browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding-top:20px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s}
.card:hover{border-color:var(--line-2);box-shadow:0 4px 16px rgba(0,0,0,0.07);transform:translateY(-1px)}
.card-img{position:relative;background:var(--bg);aspect-ratio:16/10;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-sev{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700}
.card-body{padding:12px 14px}
.card-det{font-size:13px;font-weight:600;color:var(--ink)}
.card-part{font-size:12px;color:var(--ink-3);margin-top:2px}
.card-footer{padding:9px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-4)}

/* Truck layout */
.location-wrap{padding:20px 0}
.loc-tabs{display:flex;gap:4px;margin-bottom:16px;padding:4px;background:var(--bg);border-radius:8px;width:fit-content;border:1.5px solid var(--line)}
.loc-tab{padding:6px 16px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-3);cursor:pointer;transition:all .12s}
.loc-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.loc-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.loc-svg-wrap{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:20px}
.loc-svg-wrap svg{display:block;width:100%;height:auto}
.loc-svg-wrap .tz{cursor:pointer}
.loc-svg-wrap .tz>*{fill:var(--bg);stroke:var(--ink-4);stroke-width:1.5;transition:fill .15s}
.loc-svg-wrap .tz path[fill=none]{fill:none}
.loc-svg-wrap .tz:hover>*{fill:var(--zone-hover)}
.loc-svg-wrap .tz.on>*{fill:var(--zone-active);stroke:var(--zone-active)}
.loc-svg-wrap .tz.on path[fill=none]{fill:none;stroke:var(--zone-active)}
.loc-svg-wrap .tg{stroke:var(--line-2);stroke-width:2}
.loc-svg-wrap .tl{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--ink-4)}
.loc-zones{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.loc-zone-hd{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between}
.loc-zone-list{max-height:400px;overflow-y:auto}
.loc-zone-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .1s}
.loc-zone-item:last-child{border-bottom:none}
.loc-zone-item:hover{background:var(--bg)}
.loc-zone-item.active{background:var(--zone-active-soft)}
.loc-zone-dot{width:8px;height:8px;border-radius:50%;background:var(--zone-active);flex-shrink:0}
.loc-zone-dot.empty{background:var(--line-2)}
.loc-zone-name{flex:1;font-size:13px;font-weight:500;color:var(--ink)}
.loc-zone-cnt{font-size:11.5px;font-weight:600;color:var(--teal)}
.loc-zone-cnt.empty{color:var(--ink-4)}
.loc-results{margin-top:16px}
.loc-result-hd{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.loc-result-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;margin-bottom:6px;transition:all .12s}
.loc-result-row:hover{border-color:var(--line-2);box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.loc-result-thumb{width:52px;height:36px;border-radius:5px;overflow:hidden;background:var(--bg);flex-shrink:0}
.loc-result-thumb img{width:100%;height:100%;object-fit:cover}

/* PDV overlay */
.pdv-overlay{position:fixed;inset:0;z-index:200;display:flex}
.pdv-scrim{flex:1;background:rgba(0,0,0,0.35);backdrop-filter:blur(2px)}
.pdv{width:680px;max-width:100%;background:var(--surface);height:100%;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(0,0,0,0.15)}
.pdv-hd{padding:18px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px;position:sticky;top:0;background:var(--surface);z-index:10}
.pdv-back{color:var(--ink-3);display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;padding:6px 10px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;transition:all .12s;margin-top:3px}
.pdv-back:hover{border-color:var(--line-2);color:var(--ink)}
.pdv-title h2{font-size:20px;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:4px}
.pdv-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.veh-badge{padding:3px 9px;background:var(--navy);color:white;border-radius:4px;font-size:11px;font-weight:600}
.pdv-sec{padding:18px 24px;border-bottom:1px solid var(--line)}
.pdv-sec-title{font-size:11px;font-weight:700;color:var(--ink-4);letter-spacing:0.6px;margin-bottom:12px}

/* Carousels */
.carousel-label{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:5px;font-size:11.5px;font-weight:700;margin-bottom:12px}
.carousel-label.healthy{background:#dcfce7;color:#15803d;border:1.5px solid #bbf7d0}
.carousel-label.damaged{background:var(--s1b);color:var(--s1);border:1.5px solid var(--s1l)}
.carousel-track{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel-track::-webkit-scrollbar{display:none}
.cr-slide{flex:0 0 auto;width:280px;border:2px solid var(--line);border-radius:8px;overflow:hidden;scroll-snap-align:start;cursor:pointer;transition:border-color .15s}
.cr-slide.healthy-s{border-color:#bbf7d0}.cr-slide.damaged-s{border-color:var(--s1l)}
.cr-slide:hover{border-color:var(--line-2)}.cr-slide.healthy-s:hover{border-color:#86efac}.cr-slide.damaged-s:hover{border-color:var(--s1)}
.cr-img{aspect-ratio:16/10;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.cr-img img{width:100%;height:100%;object-fit:cover}
.cr-label{padding:10px 12px;background:var(--surface)}
.cr-label-main{font-size:12.5px;font-weight:600;color:var(--ink)}
.cr-label-sub{font-size:11px;color:var(--ink-3);margin-top:2px}

/* DL rows in PDV */
.dl-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;transition:all .12s;margin-bottom:6px}
.dl-row:hover{border-color:var(--line-2);background:var(--bg)}
.dl-thumb{width:52px;height:36px;border-radius:5px;overflow:hidden;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dl-thumb img{width:100%;height:100%;object-fit:cover}
.dl-det{flex:1}
.dl-det-name{font-size:13px;font-weight:600;color:var(--ink)}
.dl-det-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.dl-det-imgs{font-size:11.5px;font-weight:600;color:var(--teal)}
.dl-det-noimgs{font-size:11.5px;color:var(--ink-4)}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:500;background:rgba(10,15,30,0.96);display:flex;flex-direction:column;user-select:none}
.lb-toolbar{padding:14px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.08)}
.lb-info{flex:1;font-size:13px;font-weight:500;color:white}
.lb-info-sub{font-size:11.5px;color:rgba(255,255,255,0.45);margin-top:2px}
.lb-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:7px;border:1.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;background:transparent;font-family:inherit}
.lb-btn:hover{background:rgba(255,255,255,0.1);color:white}
.lb-btn.on{background:rgba(255,255,255,0.15);color:white}
.lb-btn-icon{padding:7px;border-radius:7px;border:1.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;background:transparent}
.lb-btn-icon:hover{background:rgba(255,255,255,0.1);color:white}
.lb-bright-wrap{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.5);font-size:12px}
.lb-bright-slider{accent-color:white;width:80px;cursor:pointer}
.lb-bright-val{min-width:30px;text-align:right;color:rgba(255,255,255,0.7);font-size:12px}
.lb-vp{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.lb-transform{position:relative;transform-origin:center;will-change:transform;cursor:grab;line-height:0}
.lb-transform:active{cursor:grabbing}
.lb-transform img{max-height:calc(100vh - 160px);max-width:100%;object-fit:contain;display:block}
.lb-bbox{position:absolute;border:2px dashed #f59e0b;border-radius:3px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,0.3),inset 0 0 0 1px rgba(0,0,0,0.3);display:none}
.lb-bbox.show{display:block}
.lb-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.15);color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;z-index:10}
.lb-nav-btn:hover{background:rgba(0,0,0,0.75)}
.lb-nav-btn.prev{left:16px}.lb-nav-btn.next{right:16px}
.lb-film{padding:12px 20px;display:flex;align-items:center;gap:8px;overflow-x:auto;border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0;scrollbar-width:none}
.lb-film::-webkit-scrollbar{display:none}
.lb-thumb-film{width:52px;height:36px;border-radius:5px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,0.15);opacity:0.5;transition:all .15s;flex-shrink:0}
.lb-thumb-film:hover{opacity:0.75}.lb-thumb-film.active{opacity:1;border-color:white}
.lb-thumb-film img{width:100%;height:100%;object-fit:cover}
.lb-count{font-size:12px;color:rgba(255,255,255,0.4);margin-left:auto;flex-shrink:0}

/* Admin panel */
.admin-overlay{position:fixed;inset:0;z-index:300;display:flex}
.admin-scrim{flex:1;background:rgba(0,0,0,0.3);backdrop-filter:blur(2px)}
.admin{width:560px;max-width:100%;background:var(--surface);height:100%;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(0,0,0,0.15)}
.admin-hd{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--surface);z-index:10}
.admin-hd h2{font-size:17px;font-weight:700;color:var(--ink);flex:1}
.admin-body{padding:24px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:6px;letter-spacing:0.3px}
.form-input{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:7px;font-size:13px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--teal)}
.form-select{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:7px;font-size:13px;color:var(--ink);background:var(--bg);outline:none;cursor:pointer}
.form-select:focus{border-color:var(--teal)}
.form-textarea{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:7px;font-size:13px;color:var(--ink);background:var(--bg);outline:none;resize:vertical;min-height:80px}
.form-textarea:focus{border-color:var(--teal)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-primary{padding:9px 20px;background:var(--teal);color:white;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:background .12s}
.btn-primary:hover{background:#0f766e}
.btn-secondary{padding:9px 20px;background:var(--bg);color:var(--ink-2);border-radius:7px;font-size:13.5px;font-weight:500;cursor:pointer;border:1.5px solid var(--line);transition:all .12s}
.btn-secondary:hover{border-color:var(--line-2);color:var(--ink)}
.admin-notice{padding:12px 16px;background:var(--s3b);border:1.5px solid var(--s3l);border-radius:8px;font-size:12.5px;color:var(--s3);margin-bottom:20px}

/* Misc */
.ph-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-4);padding:24px}
.ph-wrap svg{opacity:0.3}
.ph-wrap span{font-size:11px}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:14px;color:var(--ink-3)}
.spinner{width:28px;height:28px;border:2.5px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.section-hd{padding:24px 0 4px;display:flex;align-items:center;justify-content:space-between}
.section-hd h2{font-size:17px;font-weight:700;color:var(--ink)}
.section-hd small{font-size:12px;color:var(--ink-4)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-size:11.5px;font-weight:500}
.chip-veh{background:var(--navy-mid);color:rgba(255,255,255,0.9)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}

/* Mobile */
@media(max-width:768px){
  :root{--sidebar:0px}
  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:60px}
  .mob-nav{display:flex!important}
  .browse-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .pdv{width:100%}
  .ov-sev{grid-template-columns:1fr}
  .ov-stats{grid-template-columns:1fr 1fr}
  .loc-layout{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .filterbar{padding:10px 16px}
  .content{padding:0 16px 48px}
}
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.mob-nav-inner{display:flex;align-items:stretch}
.mob-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;cursor:pointer;color:var(--ink-4);font-size:10px;font-weight:500;transition:color .12s}
.mob-nav-item.active{color:var(--teal)}
.mob-nav-item svg{opacity:0.7}
.mob-nav-item.active svg{opacity:1}

// Zone mapping function (ported from original artifact)
function getZoneIds(row){
  const p=(row.carPart||'').toLowerCase();
  const a=(row.area||'').toLowerCase();
  const c=(row.category||'').toLowerCase();
  const T=row.vehicle==='Truck'||row.vehicle==='Both';
  const Rr=row.vehicle==='Trailer'||row.vehicle==='Both';
  const tr=Rr&&!T;
  const z=[];
  const add=(...ids)=>z.push(...ids);
  const wheels=()=>{T&&add('steer','drive');Rr&&add('tTires')};
  if(/tire|tread|sidewall|atis/.test(p)||a==='tires'&&!/rim|hub|lug|wheel|mud/.test(p))wheels();
  else if(/rim|hub|lug|wheel/.test(p))wheels();
  else if(/mud ?flap|mud ?guard/.test(p)){T&&add('flapT');Rr&&add('flapTr');}
  else if(/d\.?o\.?t\.? bumper|rear bumper|under ?ride/.test(p)||/bumper/.test(p)&&tr)add('dot');
  else if(/bumper/.test(p))add('bumperF');
  else if(/grille|hood|emblem|vent/.test(p)&&!/trailer/.test(p))add('front');
  else if(/head ?light|fog/.test(p))add('head');
  else if(/windshield|wiper|sun visor/.test(p))add('wind');
  else if(/mirror/.test(p))add('mirror');
  else if(/sleeper/.test(p))add('sleeper');
  else if(/extender|deflector/.test(p)&&!/dome/.test(p))add('ext');
  else if(/dome|roof fairing/.test(p)||/roof/.test(p)&&T&&!tr)add('roofT');
  else if(/roof/.test(p))add('roofTr');
  else if(/fuel tank|fuel cap/.test(p))add('fuel');
  else if(/step/.test(p))add('step');
  else if(/cab|door handle|window|door striker|side door/.test(p)&&!tr)add('cab');
  else if(/fifth wheel/.test(p))add('fifth');
  else if(/glad|7 ?way|air line|electrical|any lines/.test(p))add('couple');
  else if(/header/.test(p))add('header');
  else if(/landing/.test(p))add('land');
  else if(/slide|tandem/.test(p))add('slide');
  else if(/cargo door|rear door|hinge|locking rod|door frame|rear cargo/.test(p))add('rear');
  else if(/tail|brake light/.test(p)){T&&!tr&&add('tail');Rr&&add('tail');}
  else if(/marker|clearance/.test(p))add('marker');
  else if(/abs|ctis/.test(p))add('abs');
  else if(/skirt|aero|flow ?below|v-panel/.test(p))add('skirt');
  else if(/wall|panel|decal|rail|floor|side door/.test(p)&&(tr||T&&Rr))add('wall');
  else if(/license/.test(p)){tr?add('dot'):add('bumperF');}
  else if(a==='undercarriage'||/bottom|brake/.test((row.orientation||'').toLowerCase())){T&&add('frameT');Rr&&add('underTr');}
  else if(c.includes('panels')||c.includes('accessories')){T&&add('cab');Rr&&add('wall');}
  if(!z.length){T&&add('cab');Rr&&add('wall');}
  return[...new Set(z)];
}

// FILTER BAR

function FilterBar({data,filters,setFilters,totalVisible}){
  const cats=useMemo(()=>[...new Set(data.map(r=>r.category))].filter(Boolean).sort(),[data]);
  const dets=useMemo(()=>[...new Set(data.map(r=>r.detection))].filter(Boolean).sort(),[data]);
  const oris=useMemo(()=>[...new Set(data.map(r=>r.orientation))].filter(Boolean).sort(),[data]);
  function toggleSev(s){setFilters(f=>{const n=new Set(f.sevs);n.has(s)?n.delete(s):n.add(s);return{...f,sevs:n};});}
  const sevCounts={'SEV 1':0,'SEV 2':0,'SEV 3':0};for(const r of data)sevCounts[r.sev]=(sevCounts[r.sev]||0)+1;
  return x('div',{className:'filterbar'},
    x('div',{className:'search-wrap'},x(Ic.search),x('input',{className:'search-input',placeholder:'Search damage lines…',value:filters.search,onChange:e=>setFilters(f=>({...f,search:e.target.value}))})),
    x('div',{className:'filter-sep'}),

    x('select',{className:'filter-select',value:filters.category,onChange:e=>setFilters(f=>({...f,category:e.target.value}))},x('option',{value:''},'Category'),cats.map(c=>x('option',{key:c,value:c},c))),
    x('select',{className:'filter-select',value:filters.detection,onChange:e=>setFilters(f=>({...f,detection:e.target.value}))},x('option',{value:''},'Damage type'),dets.map(d=>x('option',{key:d,value:d},d))),
    x('select',{className:'filter-select',value:filters.orientation,onChange:e=>setFilters(f=>({...f,orientation:e.target.value}))},x('option',{value:''},'Orientation'),oris.map(o=>x('option',{key:o,value:o},o))),
    x('div',{className:'filter-sep'}),
    x('button',{className:'filter-examples'+(filters.withExamples?' active':''),onClick:()=>setFilters(f=>({...f,withExamples:!f.withExamples}))},x(Ic.img),' With examples',x('span',{className:'filter-count'},totalVisible))
  );
}

    const entry={...form,id:`dl-${Date.now()}`,images:{healthy:[],damaged:[]},scanLinks:[],cost:'',method:'',action:''};

    x('div',{className:'admin-scrim',onClick:onClose}),
    x('div',{className:'admin'},

      x('div',{className:'admin-body'},
        x('div',{className:'admin-notice'},x('strong',null,'Internal only. '),'Entries saved here are stored locally in this browser and are not committed to the shared catalog. Contact the data owner to submit new entries for the main catalog.'),
        x('div',{className:'form-row'},
          x('div',{className:'form-group'},x('label',{className:'form-label'},'Car Part'),x('input',{className:'form-input',value:form.carPart,onChange:f('carPart'),placeholder:'e.g. Mud flap bracket'})),
          x('div',{className:'form-group'},x('label',{className:'form-label'},'Damage Detection'),x('input',{className:'form-input',value:form.detection,onChange:f('detection'),placeholder:'e.g. Broken'}))
        ),
        x('div',{className:'form-row'},
          x('div',{className:'form-group'},x('label',{className:'form-label'},'Severity'),x('select',{className:'form-select',value:form.sev,onChange:f('sev')},x('option',null,'SEV 1'),x('option',null,'SEV 2'),x('option',null,'SEV 3'))),
          x('div',{className:'form-group'},x('label',{className:'form-label'},'Vehicle'),x('select',{className:'form-select',value:form.vehicle,onChange:f('vehicle')},x('option',null,'Truck'),x('option',null,'Trailer'),x('option',null,'Both')))
        ),
        x('div',{className:'form-row'},
          x('div',{className:'form-group'},x('label',{className:'form-label'},'Category'),x('input',{className:'form-input',value:form.category,onChange:f('category'),placeholder:'e.g. D.O.T Accessories',list:'cats'}),x('datalist',{id:'cats'},cats.map(c=>x('option',{key:c,value:c})))),
          x('div',{className:'form-group'},x('label',{className:'form-label'},'Area'),x('input',{className:'form-input',value:form.area,onChange:f('area'),placeholder:'e.g. Tires',list:'areas'}),x('datalist',{id:'areas'},areas.map(a=>x('option',{key:a,value:a}))))
        ),
        x('div',{className:'form-group'},x('label',{className:'form-label'},'Orientation'),x('input',{className:'form-input',value:form.orientation,onChange:f('orientation'),placeholder:'e.g. Side wall',list:'oris'}),x('datalist',{id:'oris'},oris.map(o=>x('option',{key:o,value:o})))),
        x('div',{className:'form-group'},x('label',{className:'form-label'},'Impact'),x('input',{className:'form-input',value:form.impact,onChange:f('impact'),placeholder:'e.g. D.O.T & Safety'})),
        x('div',{className:'form-group'},x('label',{className:'form-label'},'Criteria / Detection notes'),x('textarea',{className:'form-textarea',value:form.criteria,onChange:f('criteria'),placeholder:'What to look for, what constitutes this damage…'})),
        x('div',{style:{display:'flex',gap:10,marginTop:8}},
          x('button',{className:'btn-primary',onClick:handleSave},saved?'✓ Saved!':'Save entry'),

// ═══════════════════════════════════════════════
// SIDEBAR

const NAV=[{id:'overview',label:'Overview',Icon:Ic.grid},{id:'location',label:'Location',Icon:Ic.map},{id:'lines',label:'Damage lines',Icon:Ic.list},{id:'parts',label:'Car parts',Icon:Ic.car},{id:'browse',label:'Browse',Icon:Ic.img}];

// ═══════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════
function App(){
  const[data,setData]=useState(null);
  const[error,setError]=useState(null);
  const[tab,setTab]=useState('browse');
  const[activePart,setActivePart]=useState(null);
  const[lightbox,setLightbox]=useState(null);
  const[showAdmin,setShowAdmin]=useState(false);
  const[filters,setFilters]=useState({search:'',sevs:new Set(),withExamples:false,category:'',detection:'',orientation:''});

  // Dark mode
  const[dark,setDark]=useState(()=>window.matchMedia('(prefers-color-scheme: dark)').matches||(localStorage.getItem('dd_dark')==='1'));
  useEffect(()=>{document.documentElement.classList.toggle('dark',dark);localStorage.setItem('dd_dark',dark?'1':'0');},[dark]);

  // Admin flag
  const isAdmin=useMemo(()=>location.search.includes('admin')||location.hash.includes('admin'),[]);

  // Fleet
  const fleet=useMemo(()=>{const m=window.location.hash.match(/fleet=([a-z]+)/);return m?m[1]:null;},[]);

  // Load data
  useEffect(()=>{
    fetch(LIB_URL)
      .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();})
      .then(d=>{
        // Merge any local entries
        const local=JSON.parse(localStorage.getItem('dd_local_entries')||'[]');
        setData([...d,...local]);
      })
      .catch(e=>setError(e.message));
  },[]);

  // Filter
  const filtered=useMemo(()=>{
    if(!data)return[];
    return data.filter(row=>{
      if(fleet&&!row.images.damaged.length&&!row.images.healthy.length)return false;
      if(filters.withExamples&&!row.images.damaged.length)return false;
      if(filters.sevs.size&&!filters.sevs.has(row.sev))return false;
      if(filters.category&&row.category!==filters.category)return false;
      if(filters.detection&&row.detection!==filters.detection)return false;
      if(filters.orientation&&row.orientation!==filters.orientation)return false;
      if(filters.search){const q=norm(filters.search);return norm(row.carPart).includes(q)||norm(row.detection).includes(q)||norm(row.category).includes(q);}
      return true;
    });
  },[data,filters,fleet]);

  const withExCount=useMemo(()=>filtered.filter(r=>r.images.damaged.length>0).length,[filtered]);
  const pdvRows=useMemo(()=>activePart?filtered.filter(r=>r.carPart===activePart):[],[activePart,filtered]);
  function openLightbox(images,idx,label){setLightbox({images,idx,label});}
  function onSetSevFilter(sev){setFilters(f=>{const n=new Set([sev]);return{...f,sevs:n};});setTab('lines');}

  if(error)return x('div',{className:'loading'},x('div',{style:{color:'var(--s1)',fontWeight:600,fontSize:14}},'Failed to load data'),x('div',{style:{fontSize:12,color:'var(--ink-3)',marginTop:4}},error),x('div',{style:{fontSize:12,color:'var(--ink-4)',marginTop:12,maxWidth:320,textAlign:'center'}},'Make sure damage-library.json is in the truck-catalog repo root.'));
  if(!data)return x('div',{className:'loading'},x('div',{className:'spinner'}),x('div',null,'Loading damage catalog…'));

  return x(Fragment,null,
    x(Sidebar,{tab,setTab,fleet,dark,onToggleDark:()=>setDark(d=>!d),onOpenAdmin:()=>setShowAdmin(true),isAdmin}),
    x(MobNav,{tab,setTab}),
    x('div',{className:'main'},
      fleet&&x('div',{className:'fleet-banner'},x('div',{className:'fleet-banner-name'},FLEETS[fleet]||fleet,' · Fleet view'),x('div',{className:'fleet-banner-actions'},x('a',{href:'#'},'← Internal view'))),
      x(FilterBar,{data,filters,setFilters,totalVisible:withExCount}),
      x('div',{className:'content'},
        x('div',{className:'section-hd'},
          x('h2',null,{overview:'Overview',location:'Location',lines:'Damage lines',parts:'Car parts',browse:'Browse catalog'}[tab]||''),
          x('small',null,filtered.length.toLocaleString()+' damage types')
        ),
        tab==='overview'&&x(Overview,{data:filtered,fleet,onSetFilter:onSetSevFilter}),
        tab==='location'&&x(Location,{data:filtered,fleet,onSelectPart:setActivePart,onOpenLightbox:openLightbox}),
        tab==='lines'&&x(DamageLines,{data:filtered,fleet,onSelectPart:setActivePart}),
        tab==='parts'&&x(CarParts,{data:filtered,fleet,onSelectPart:setActivePart}),
        tab==='browse'&&x(Browse,{data:filtered,fleet,onSelectPart:setActivePart,onOpenLightbox:openLightbox}),
      )
    ),
    activePart&&pdvRows.length>0&&x(PDV,{rows:pdvRows,partName:activePart,fleet,onClose:()=>setActivePart(null),onOpenLightbox:openLightbox}),
    lightbox&&x(Lightbox,{...lightbox,onClose:()=>setLightbox(null)}),
    showAdmin&&x(AdminPanel,{onClose:()=>setShowAdmin(false),data:data||[]})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(x(App));
})();
</script>
